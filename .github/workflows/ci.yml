name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip Pillow pytest
      - run: python -m pip install -e bindings/python
      - run: python -m pytest tests/python -q

  go:
    name: Go format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: test -z "$(gofmt -l bindings/go)"
      - run: go test ./...
        working-directory: bindings/go
